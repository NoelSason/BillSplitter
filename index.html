<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Split bills easily with friends - assign items, calculate tax and tip proportionally">
    <title>Bill Splitter - Split Bills with Friends</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <h1>Bill Splitter</h1>
        <p>Split bills easily with friends - assign items, calculate tax & tip proportionally</p>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- People Management Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">People</h3>
            </div>

            <div class="flex" style="margin-bottom: 1rem;">
                <input type="text" id="personNameInput" class="input" placeholder="Enter person's name"
                    style="flex: 1;">
                <button class="btn btn-primary" onclick="addPerson()">
                    Add Person
                </button>
            </div>

            <div class="person-chips" id="peopleList">
                <!-- People chips will be added here dynamically -->
            </div>
        </div>

        <!-- Bill Items Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Bill Items</h3>
            </div>

            <div class="grid-2" style="margin-bottom: 1rem;">
                <input type="text" id="itemNameInput" class="input" placeholder="Item name (e.g., Burger)">
                <input type="number" id="itemPriceInput" class="input" placeholder="Price (e.g., 12.99)" step="0.01"
                    min="0">
            </div>

            <button class="btn btn-primary" onclick="addItem()" style="width: 100%;">
                Add Item
            </button>

            <ul class="item-list" id="itemsList">
                <!-- Items will be added here dynamically -->
            </ul>
        </div>

        <!-- Tax & Tip Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Tax & Tip</h3>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label class="input-label">Tax (%)</label>
                    <input type="number" id="taxInput" class="input" placeholder="8.5" step="0.1" min="0" value="0"
                        oninput="calculateSummary()" onchange="calculateSummary()">
                </div>

                <div class="input-group">
                    <label class="input-label">Tip</label>
                    <div class="tip-type-toggle" style="margin-bottom: 0.75rem;">
                        <label>
                            <input type="radio" name="tipType" value="percent" checked onchange="handleTipTypeChange()">
                            <span>Percentage (%)</span>
                        </label>
                        <label>
                            <input type="radio" name="tipType" value="dollar" onchange="handleTipTypeChange()">
                            <span>Dollar Amount ($)</span>
                        </label>
                    </div>
                    <input type="number" id="tipInput" class="input" placeholder="18" step="0.1" min="0" value="0"
                        oninput="calculateSummary()" onchange="calculateSummary()">
                </div>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Summary</h3>
                <button class="btn btn-secondary btn-small" onclick="resetAll()">
                    Reset All
                </button>
            </div>

            <div id="summaryContainer">
                <p class="text-muted text-center">Add people and items to see the split breakdown</p>
            </div>

            <button class="btn btn-primary" onclick="copySummary()" id="copyButton"
                style="width: 100%; margin-top: 1rem; display: none;">
                Copy Summary
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
